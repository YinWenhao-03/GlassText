name: Windows build
on:
  workflow_dispatch:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Renderer integration (not native UI acceptance)
        shell: pwsh
        run: |
          $env:GLASSTEXT_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: GlassText-Windows-x64
          path: dist/windows/*.zip
