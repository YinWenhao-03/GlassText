<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>透明文字</title><link rel="stylesheet" href="style.css"><body>
<header><img src="assets/icon.png" alt=""><div><h1>透明文字</h1><small>把资料放在手边 · Windows 预览版</small></div></header>
<nav><button data-tab="content" class="active">内容</button><button data-tab="appearance">外观</button><button data-tab="settings">设置</button></nav>
<main><section id="content"><button id="open">打开文件…</button><button id="cancel">取消读取</button><p id="notice" role="status">支持 PDF、DOCX、TXT，也可以拖到这里</p><textarea id="editor" aria-label="展示文字" placeholder="输入你想展示的文字"></textarea><button id="apply" class="primary">显示这段文字</button></section>
<section id="appearance" hidden><label>字号 <input id="font" type="range" min="16" max="96" value="36"></label><label>文字颜色 <input id="color" type="color" value="#ffffff"></label><label><input id="outline" type="checkbox" checked>描边，让文字更清楚</label><div class="row"><button id="panLeft">← 平移</button><button id="panUp">↑</button><button id="panDown">↓</button><button id="panRight">→</button></div><p>PDF 保留页面布局并自动去除白底。文字颜色和字号只影响纯文字。</p></section>
<section id="settings" hidden><label><input id="lockPaging" type="checkbox">锁定时禁止翻页</label><label><input id="lockZoom" type="checkbox">锁定时禁止缩放</label><p>未勾选时，锁定后仍可通过本面板操作。展示窗口始终鼠标穿透。</p><p id="hotkey">全局恢复：Ctrl + Alt + G</p><p>DOCX 按纯文字读取，保留版式请先导出 PDF。</p></section></main>
<footer><p id="mode" role="status">调整中</p><div class="row"><button id="prev">←</button><span id="pageStatus">1 / 1</span><button id="next">→</button><input id="page" type="number" min="1" value="1" aria-label="跳转页码"><button id="jump">前往</button></div><div class="row"><span>缩放</span><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button><button id="fit">重置</button></div><div class="row"><label><input id="topmost" type="checkbox" checked>置顶</label><button id="visible">隐藏</button><button id="guide">新手引导</button><button id="lock" class="primary">锁定展示</button></div><button id="quit" class="quiet">退出</button></footer>
<dialog id="help"><h2 id="helpTitle"></h2><canvas id="shot" width="390" height="260"></canvas><p id="helpText"></p><div class="row"><button id="helpPrev">上一步</button><button id="helpNext">下一步</button><button id="helpClose">关闭</button></div></dialog><script src="control.mjs" type="module"></script></body></html>
