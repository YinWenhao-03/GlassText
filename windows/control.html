<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>透明文字</title><link rel="stylesheet" href="style.css"><body>
<header><img src="assets/icon.png" alt=""><div><h1>透明文字</h1><small>把资料放在手边 · Windows 预览版</small></div></header>
<nav><button data-tab="content" class="active">内容</button><button data-tab="appearance">外观</button><button data-tab="prompter">提词</button><button data-tab="settings">设置</button></nav>
<main><section id="content"><button id="open">打开文件…</button><button id="cancel">取消读取</button><p id="notice" role="status">支持 PDF、DOCX、TXT；DOC/RTF 需 LibreOffice，也可以拖到这里</p><textarea id="editor" aria-label="展示文字" placeholder="输入你想展示的文字"></textarea><button id="apply" class="primary">显示这段文字</button></section>
<section id="appearance" hidden><label><input id="removeWhite" type="checkbox" checked>PDF 去除白底</label><label>字号 <input id="font" type="range" min="16" max="96" value="36"></label><label>文字颜色 <input id="color" type="color" value="#ffffff"></label><label><input id="outline" type="checkbox" checked>描边，让文字更清楚</label><details><summary>更多外观设置</summary><label>文字粗细 <select id="weight"><option value="400">常规</option><option value="500">中等</option><option value="700">粗体</option></select></label><label>对齐 <select id="alignment"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></label><label>额外行距 <input id="spacing" type="range" min="0" max="30" value="0"></label><label>内容不透明度 <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1"></label><label>阅读底色 <input id="backdrop" type="range" min="0" max="1" step="0.05" value="0"></label><label>PDF 去白强度 <input id="whiteStrength" type="range" min="0" max="1" step="0.05" value="1"></label></details><div class="row"><button id="panLeft">← 平移</button><button id="panUp">↑</button><button id="panDown">↓</button><button id="panRight">→</button></div><p>PDF 可切换透明去白或原始页面。文字颜色和字号只影响纯文字。</p></section>
<section id="settings" hidden><label>展示屏幕 <select id="display" aria-label="展示屏幕"></select></label><button id="snapshot">固定当前画面</button><button id="clearSnapshots">关闭固定画面</button><label><input id="lockPaging" type="checkbox">锁定时禁止翻页</label><label><input id="lockZoom" type="checkbox">锁定时禁止缩放</label><p>未勾选时，锁定后仍可通过本面板操作。展示窗口始终鼠标穿透。</p><p id="hotkey">全局恢复：Ctrl + Alt + G</p><label><input id="preserveLayout" type="checkbox">Word 保留版式（需安装 LibreOffice）</label><label>恢复快捷键 <input id="shortcut" value="Control+Alt+G" aria-label="恢复快捷键"></label><button id="saveShortcut">保存快捷键</button><button id="recover">找回展示窗口</button><button id="updates">查看更新</button><p>阅读内容、页码和窗口位置仅保存在本机。使用共享电脑时可清除记录。</p><button id="forget">清除阅读记录</button></section><section id="prompter" hidden><p>仅适用于文字。开始后倒计时 3 秒，自动向上滚动；锁定翻页会同时暂停提词。</p><label><input id="promptMode" type="checkbox">连续提词模式</label><label>速度 <input id="speed" type="range" min="5" max="100" value="30"></label><button id="prompting">开始提词</button><button id="promptReset">回到开头</button><p id="promptStatus" role="status"></p></section></main>
<footer><p id="mode" role="status">调整中</p><div class="row"><button id="prev" aria-label="上一页">←</button><span id="pageStatus">1 / 1</span><button id="next" aria-label="下一页">→</button><input id="page" type="number" min="1" value="1" aria-label="跳转页码"><button id="jump">前往</button></div><div class="row"><span>缩放</span><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button><button id="fit">重置</button></div><div class="row"><label><input id="topmost" type="checkbox" checked>置顶</label><button id="visible">隐藏</button><button id="guide">新手引导</button><button id="lock" class="primary">锁定展示</button></div><button id="quit" class="quiet">退出</button></footer>
<dialog id="help"><h2 id="helpTitle"></h2><canvas id="shot" width="390" height="260"></canvas><p id="helpText"></p><div class="row"><button id="helpPrev">上一步</button><button id="helpNext">下一步</button><button id="helpClose">关闭</button></div></dialog><script src="control.mjs" type="module"></script></body></html>
